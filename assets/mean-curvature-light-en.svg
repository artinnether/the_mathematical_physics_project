<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380"><title>Qué significa el flujo por curvatura media</title><desc>En una esfera, las flechas normales apuntan hacia el centro. La esfera se contrae y, al disminuir su radio, aumenta su curvatura y su rapidez de contracción.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#9b603d"/></marker><marker id="normal-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#426d93"/></marker><marker id="position-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#263a50"/></marker></defs><circle cx="150" cy="176" r="88" fill="none" stroke="#6d7985" stroke-opacity=".28" stroke-dasharray="4 6"/><circle cx="150" cy="176" r="88" fill="#426d93" fill-opacity=".07" stroke="#426d93" stroke-width="1.8"/><ellipse cx="150" cy="176" rx="88" ry="24.64" fill="none" stroke="#426d93" stroke-opacity=".55"/><ellipse cx="150" cy="176" rx="31.68" ry="88" fill="none" stroke="#426d93" stroke-opacity=".55"/><path d="M238.00,176.00 L216.00,176.00" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M212.23,238.23 L196.67,222.67" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M150.00,264.00 L150.00,242.00" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M87.77,238.23 L103.33,222.67" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M62.00,176.00 L84.00,176.00" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M87.77,113.77 L103.33,129.33" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M150.00,88.00 L150.00,110.00" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M212.23,113.77 L196.67,129.33" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><text x="150" y="44" text-anchor="middle" fill="#263a50" font-family="Georgia,serif" font-size="23">t₀</text><text x="150" y="300" text-anchor="middle" fill="#263a50" font-family="Georgia,serif" font-size="19">Larger radius</text><circle cx="425" cy="176" r="88" fill="none" stroke="#6d7985" stroke-opacity=".28" stroke-dasharray="4 6"/><circle cx="425" cy="176" r="63" fill="#426d93" fill-opacity=".07" stroke="#426d93" stroke-width="1.8"/><ellipse cx="425" cy="176" rx="63" ry="17.64" fill="none" stroke="#426d93" stroke-opacity=".55"/><ellipse cx="425" cy="176" rx="22.68" ry="63" fill="none" stroke="#426d93" stroke-opacity=".55"/><path d="M488.00,176.00 L462.00,176.00" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M469.55,220.55 L451.16,202.16" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M425.00,239.00 L425.00,213.00" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M380.45,220.55 L398.84,202.16" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M362.00,176.00 L388.00,176.00" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M380.45,131.45 L398.84,149.84" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M425.00,113.00 L425.00,139.00" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M469.55,131.45 L451.16,149.84" stroke="#9b603d" stroke-width="1.7" marker-end="url(#arrow)"/><text x="425" y="44" text-anchor="middle" fill="#263a50" font-family="Georgia,serif" font-size="23">t₁</text><text x="425" y="300" text-anchor="middle" fill="#263a50" font-family="Georgia,serif" font-size="19">Smaller radius</text><circle cx="690" cy="176" r="88" fill="none" stroke="#6d7985" stroke-opacity=".28" stroke-dasharray="4 6"/><circle cx="690" cy="176" r="34" fill="#426d93" fill-opacity=".07" stroke="#426d93" stroke-width="1.8"/><ellipse cx="690" cy="176" rx="34" ry="9.520000000000001" fill="none" stroke="#426d93" stroke-opacity=".55"/><ellipse cx="690" cy="176" rx="12.24" ry="34" fill="none" stro